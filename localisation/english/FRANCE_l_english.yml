# EVENTS
 FRA_events.1.t: "A Conspiracy to Destroy Germany"
 FRA_events.1.d: "Surprisingly, a clandestine military meeting took place in St. Petersburg today, which would have been more in place in 1856 than in 1936. A joint French, Dutch, and Italian military delegation met with General-Fieldmarshal Lavr Badanov today in surprisingly positive terms. The delegation was under the leadership of General Georges Catroux, with charles Delestraint as his deputy and Edmund Ironside leading the representation of the Dutch military. \n \nOne could almost forget about the ideological disagreements of their respective governments as they laid out a strategic plan for the destruction of Germany and Poland-Lithuania in a calm, professional manner. The general idea was for the Commonwealth and Germany to be split amongst the Socialist Alliance and the Russian bloc, though already, issues were raised on the borders being drawn up. \n \nBoth sides withheld information, no doubt thinking about the possible future conflict if they manage to destroy Germany and Poland, but were open to agree on sharing relevant military intel and some other matters that would make cooperation easier. After all, both of them shared a simple, greater goal: the destruction of the German Empire and The Polish-Lithuanian Commonwealth. And for these military men, it was a greater cause than any ideology."
 FRA_events.1.a: "A secret alliance is taking shape..."

 FRA_events.2.t: "French Demands For Nice"
 FRA_events.2.d: "The city of Nice has for long been under Italian control, even though historically it has been a 'French' city, with the majority of the citizens being French or French-speaking. Now, a French delegation has asked the Italian leadership to relegate the ownership of the historical city back to French control. Though the city of Nice has been our most important city and defence against French aggression, with the new friendly and socialist government in place, it would be a sign of good-will and cement our alliance further should we give it to France."
 FRA_events.2.a: "Nice no longer serves our purposes."
 FRA_events.2.b: "What's next? Will they ask for Piedmont too?"

 FRA_events.3.t: "French Support for Assam"
 FRA_events.3.d: "The French toads have supported Assam fr fr."
 FRA_events.3.a: "On god type shit."

 FRA_events.4.t: "Dealing with the Menace Within"
 FRA_events.4.d: "Following weeks of investigations and intelligence gathering, the government has assembled the President and the General Staff to discuss the growing communist threat within France. Reports from across the country have identified numerous clandestine cells, meeting places, and suspected revolutionary organisers. The President has made his intentions clear: the state can no longer afford to tolerate the growing subversion threatening its foundations. After a tense meeting with the military leadership, plans for a coordinated nationwide assault have been finalised. Orders are now being dispatched to the army, gendarmerie, and security services. The final operation to dismantle the communist underground is about to begin."
 FRA_events.4.a: "Commence the Operation"

 FRA_events.5.t: "The Assault Begins"
 FRA_events.5.d: "The orders have been carried out. Across France, gendarmerie units, intelligence operatives and detachments of the French Army have moved against identified communist cells, raiding meeting halls, safehouses and suspected hideouts. Numerous organisers and suspected insurgents have been arrested, while several communist newspapers and publications have been forcibly shut down. In some districts, armed resistance has broken out, leading to brief but violent clashes between government forces and communist militants. Though the operation has not been without casualties, government losses remain relatively minor, and the authorities report considerable success in dismantling the revolutionary underground. For now, the streets have grown quieter — but whether the communist movement has truly been broken remains to be seen."
 FRA_events.5.a: "Great Success!"

 FRA_events.6.t: "The Price of Crackdown"
 FRA_events.6.d: "As the campaign against the communist underground continues, reports of abuses and wrongful arrests have begun to emerge from across the country. With the army and gendarmerie operating under considerable pressure, numerous civilians and members of non-socialist organisations have been caught in the crossfire. Liberal and left-leaning newspapers have been raided, their offices shuttered and their members arrested — some killed in clashes, others seemingly targeted under accusations of revolutionary sympathies. Whether these incidents are the result of mistaken identities, overzealous commanders or deliberate persecution remains uncertain. What is certain, however, is that public outrage is spreading. Minor parties within the governing coalition have begun voicing their opposition, while sections of the French public increasingly question the methods being employed in the name of national security."
 FRA_events.6.a: "This is supposed to be a campaign against the Communists!"

 FRA_events.7.t: "The Militias Mobilize"
 FRA_events.7.d: "A series of leaked documents from the French High Command has sent shockwaves through the government. The reports appear to reveal plans extending far beyond the original campaign against communist cells, detailing the suppression of liberal and other non-socialist organisations, alongside efforts to arm and encourage radical far-right militias. These groups, already operating with increasing independence, have begun conducting their own campaigns against socialist and liberal opposition, with several incidents escalating into massacres that have left hundreds dead. Reports suggest that elements of the army and gendarmerie have either supported these militias or deliberately turned a blind eye to their actions. As public outrage spreads and the governing coalition fractures, an increasingly troubling reality is becoming apparent: the government may lose control of the situation."
 FRA_events.7.a: "Perhaps this was a bad idea..."

 FRA_events.8.t: "The Government Fractures"
 FRA_events.8.d: "The revelations from the High Command have thrown the French government into its gravest political crisis yet. Coalition partners, unwilling to remain associated with the unfolding atrocities, have begun abandoning Parliament and withdrawing their support from the President. Under mounting pressure, the President has ordered an immediate, temporary halt to the nationwide operation against the communist underground, hoping to restore order and regain control of the situation. The order, however, has been met with confusion and outright defiance. Some army and gendarmerie units have abandoned their operations and returned to their barracks, while others insist that only the High Command or their direct superiors possess the authority to issue such an order. Fighting therefore continues in several regions, despite the government's demands. Meanwhile, protests and demonstrations have erupted across the country, with public outrage threatening to overwhelm an already crumbling state."
 FRA_events.8.a: "Oh no..."

 FRA_events.9.t: "The Menace From Within"
 FRA_events.9.d: "Public outrage has spilled into the streets, with protest marches spreading across France in opposition to the government's actions. What began as largely peaceful demonstrations soon descended into violence as far-right and radical militias confronted protesters, whom they accused of aiding the revolutionary threat. The Gendarmerie struggled to contain the clashes, and the deployment of army units to reinforce them only worsened the situation. Gunfire erupted, leaving several demonstrators dead and hundreds more casualties reported across the country. \n \nYet the crisis has taken an even more alarming turn. Several days later, Gendarmerie officers detained a radical militia attempting to secure a state broadcasting station. Under interrogation, its members claimed they had received orders to seize the facility and announce a state of emergency, temporarily suspending the civilian government in favour of a military administration. The revelations point directly towards elements within the French High Command. With the army increasingly acting beyond civilian authority, the question is no longer whether the government is losing control, but whether its own generals are preparing to overthrow it."
 FRA_events.9.a: "This is the President speaking. Stop the fighting!"

 FRA_events.10.t: "France Descends Into Civil War"
 FRA_events.10.d: "The struggle for control of France has erupted into open warfare. Units loyal to the civilian government, supported by elements of the Gendarmerie, are now clashing with military-aligned militias, rebellious army formations and forces answering to the conspiratorial High Command. Amid the confusion, the communist underground has seized its opportunity. Emboldened by the growing revolutionary fervour among the population, communist cells have reorganised, arming themselves and begun mobilising openly. Across several cities and industrial centres, workers are establishing revolutionary Communes, invoking the memory of the Marseille Commune and the martyrs who fell in 1919. Their calls for a new revolution are finding an increasingly receptive audience. With fighting spreading, loyalties uncertain and armed factions multiplying by the day, the civilian government has effectively lost control of the country. France stands on the brink of a second revolution."
 FRA_events.10.a: "The Socialists! Focus on the Socialists!"

 FRA_events.11.t: "The Second Communard Revolution"
 FRA_events.11.d: "The final collapse has come. Communist forces have advanced towards Paris, bringing the fighting to its most desperate intensity yet. In a last attempt to preserve their authority, the French High Command has arrested the President and remaining coalition members, suspended Parliament and proclaimed a military dictatorship. Yet the declaration has done little to stem the tide. As communist and radical militias battle across the country, entire army formations are laying down their arms, while others have openly defected to the revolutionary cause. Around Paris, government forces are gradually overwhelmed, and communist units succeed in encircling the capital. After several days of brutal street fighting, the city finally falls. The revolutionaries proclaim the establishment of the French Commune, declaring the old Republic and its institutions dissolved. In the days that follow, surviving members of Parliament and the High Command are arreste. The French Revolution is complete."
 FRA_events.11.a: "Vive la Révolution Française! Vivent les Martyrs Marseillais!"