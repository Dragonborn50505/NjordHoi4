 FRA_scars_of_the_french_civil_war: "Scars of the French Civil War"
 FRA_scars_of_the_french_civil_war_desc: "France has endured yet another devastating upheaval, following the already catastrophic losses of the Great European War. The Second Communard Revolution has left the country deeply divided, its institutions shattered and its population exhausted by years of political violence. The victorious Communard forces are now partially demobilising, reorganising their ranks and attempting to incorporate what remains of the former French Army. However, revolutionary militias and former army formations remain poorly coordinated, inadequately trained and uncertain of their place in the new military hierarchy. Though the old regime has fallen, France is far from ready to fight another war."

 FRA_worker_oriented_economy: "Worker-Oriented Economy"
 FRA_worker_oriented_economy_desc: "With the old government dismantled, the Communards have assumed control over the entirety of the French economy. Factories, workshops and major industries are being reorganised under new syndicalist principles, with workers' organisations increasingly involved in production, distribution and economic planning. The objective is to reshape the French economy around the needs and welfare of its working population, rather than the interests of the former imperial establishment and industrial elites. However, these reforms remain in their infancy. The disruption of the civil war, uncertainty over ownership and the lack of an established economic framework have made the transition anything but straightforward."

 FRA_the_marseille_martyrs_3: "The Marseille Martyrs - Avenged"
 FRA_the_marseille_martyrs_3_desc: "For nearly two decades, the memory of the Marseille Commune and its fallen revolutionaries has served as a rallying cry for France's socialist movement. Their suppression in 1919 became a symbol of the old regime's brutality, inspiring generations of workers, activists and revolutionaries to continue their struggle. Now, with the fall of the old government and the establishment of the French Commune, the Communards proclaim that the martyrs have finally been avenged. Their names and sacrifices are celebrated throughout the country, providing the new state with a powerful revolutionary mythos and an enduring source of propaganda."

 FRA_conspiracies_of_the_general_staff_4_communist: "Lackluster High Command"
 FRA_conspiracies_of_the_general_staff_4_communist_desc: "The conclusion of the French Civil War has left the country's military leadership in complete disarray. With much of the former High Command arrested or executed for their involvement in the attempted military coup, the Communards have begun a series of investigations and trials against the remaining conspiratorial officers. However, the purges have also deprived the newly established army of much of its senior leadership and institutional experience. Experienced commanders are scarce, chains of command remain fragmented, and the revolutionary military establishment has yet to produce a capable replacement for the old officer corps."

 FRA_government_fractures_3_communist: "The Fate of the Old Parliament"
 FRA_government_fractures_3_communist_desc: "With the establishment of the French Commune, the old parliamentary system has been suspended and elections indefinitely postponed. Yet the institutions and political traditions of the former Republic have not entirely disappeared. Many former cabinet members, parliamentarians and representatives of non-socialist parties have been permitted to remain in France, for the time being allowed to live under the new revolutionary order. Others, particularly those who supported the former government until its final days or were implicated in counterrevolutionary conspiracies, have been arrested or executed. The Communards now face a difficult question: what place, if any, should the old political establishment have in the new France? Whether to restore some form of parliamentary representation, establish a socialist political monopoly or create entirely new institutions remains unresolved."

 FRA_counterrevolutionary_forces: "The Counterrevolutionary Remnants"
 FRA_counterrevolutionary_forces_desc: "Although the French Commune has secured the majority of France and proclaimed victory, the countryside remains far from pacified. Remnants of the former far-right and radical militias have scattered into rural France, regrouping in isolated communities and conducting sabotage operations against Communard infrastructure and local administrations. Alongside them, surviving members of the former French High Command have gathered their most devoted loyalists and retreated into the countryside, continuing to resist the revolutionary government through sporadic skirmishes and ambushes against Communard forces. Though no longer capable of challenging the revolution on equal terms, these scattered counterrevolutionary groups remain a persistent threat to the stability of the new state."


