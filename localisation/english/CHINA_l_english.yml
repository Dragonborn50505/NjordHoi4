 CHI_H_A_B_holdings: "C.U.I Holdings"
 CHI_H_A_B_holdings_desc: "C.U.I Holdings is the extensive commercial and industrial interests of the Prussian Chinesisches Unternehmen und Investitionskonzern (Chinese Business and Investment Concern) within the Yuan Empire. Through a network of Prussian business ventures, industrial investments and commercial partnerships, the organisation has established a considerable presence in the Chinese economy. Its enterprises provide the Yuan government with access to valuable engineering expertise, industrial technology and experienced technical personnel, contributing to the development and modernisation of Chinese factories, infrastructure and manufacturing capabilities. Although formally operating as a collection of private commercial interests, C.U.I Holdings has become an influential economic actor within the Empire, serving as an important link between Prussian industry and Yuan ambitions for industrial development."


# EVENTS
 CHI_events.1.t: "Chinese New Year"
 CHI_events.1.d: "Across the vast territories of the Yuan Empire, families gather to celebrate the arrival of the Lunar New Year, celebrated on the 24th of January, welcoming the Year of the Rat with festivities, prayers and hopes for prosperity. Yet beneath the celebrations, the Empire enters the new year burdened by considerable uncertainty. The economic decline of the past decade continues to weigh heavily upon the population, with corruption, foreign debt and uneven industrial development hindering the government's attempts at recovery. In the countryside, the expansion of opium cultivation has enriched powerful landlords and provincial authorities, but diverted valuable farmland from food production and worsened the famine and addiction crises. \n \nMeanwhile, the Imperial Court faces mounting demands for political and administrative reform, while Marshal Kurman Beg and the conservative High Command exert considerable influence over the direction of the armed forces. The Yuan military is undergoing a difficult modernisation, caught between the Marshal's ambitions and an officer corps reluctant to abandon the doctrines of the Great European War. \n \nBeyond the Empire's borders, the growing power of the Yuan's neighbours and the lingering consequences of the last great conflict offer little reassurance. As the bells ring in the new year, the Emperor's subjects celebrate and pray for good fortune. Whether the Year of the Rat will bring renewal or further hardship remains to be seen."
 CHI_events.1.a: "The Year of the Rat!"

 CHI_events.2.t: "The First Provincial Elections"
 CHI_events.2.d: "For the first time in the history of the Yuan Empire, provincial elections are being held across China, marking a significant step towards political reform. The elections are the first major achievement of the newly established Harmony Association, a gathering of reformist and liberal-minded officials within the Central Government who have long argued that the Empire must modernise not only its economy and military, but also its political institutions. Under their guidance, provincial administrations are opening their doors to elected representatives, giving local communities a greater voice in matters of governance and administration. Though the elections remain limited in scope, and the Imperial Court retains ultimate authority, their significance should not be underestimated. Conservative officials and members of the old bureaucracy view these reforms with suspicion, fearing that provincial representation may eventually undermine the authority of the throne. For the Harmony Association, however, this is only the beginning. The first foundations of a more representative Yuan government are being laid, and the path towards a constitutional and democratic future may finally be opening."
 CHI_events.2.a: "Democracy? I suppose some limited reforms can be granted."

 CHI_events.3.t: "The Yuan Debt Defaults"
 CHI_events.3.d: "The announcement from the Yuan Empire has sent shockwaves through European financial markets. In an extraordinary declaration, the Imperial Government has repudiated its outstanding international debts, declaring the agreements under which they were issued null and void. Stockbrokers across the continent have watched Yuan bonds plummet in value, while banks and financial institutions face the prospect of enormous losses. Government officials in Germany, Prussia, Russia, Austria-Hungary, Ireland and other creditor nations have expressed their outrage, condemning the decision as an unlawful repudiation of binding international agreements. \n \nFor years, European lenders have used Yuan indebtedness to secure commercial concessions, political influence and access to Chinese markets. Now, those arrangements have been thrown into question overnight. Some officials are calling for diplomatic pressure and economic retaliation, while others warn that an aggressive response could jeopardise their remaining interests in China. Whatever the response, the Yuan Empire's decision has shaken confidence in international lending and demonstrated that even the most heavily indebted nation may choose to reject the terms imposed upon it."
 CHI_events.3.a: "But a debt is a debt!"

 CHI_events.4.t: "The Yuan Demands the Return of the Three Pearls"
 CHI_events.4.d: "Diplomatic delegations from the Yuan Empire have arrived in the capitals of Europe, carrying an unmistakable demand from the Imperial Court: the return of the so-called "Three Pearls" — Ammassalik, Macao and Hong Kong. The Yuan government has formally declared that these treaty ports, long held under Dutch, Prussian and Irish administration respectively, are remnants of an unjust era of foreign concessions and must be returned to Chinese sovereignty. The delegations insist that the Empire's growing political reforms and renewed determination to restore its international standing leave no room for the continued occupation of these territories. European officials, however, have received the demands with considerable displeasure. The ports represent valuable commercial footholds and strategic positions in East Asia, and none of the three powers is particularly eager to surrender its privileges."
 CHI_events.4.a: "I suppose the port was a temporary agreement."
 CHI_events.4.b: "And lose our economic influence? I don't think so."