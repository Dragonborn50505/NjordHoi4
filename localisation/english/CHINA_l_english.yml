 CHI_corruption_in_the_armed_forces_1: "Corruption in the Armed Forces"
 CHI_corruption_in_the_armed_forces_1_desc: "Our armed force are rife with corruption and nepotism. If we want to turn them into a potent fighting force, we will have to engage in a lengthy and expensive program of army reform."

 CHI_stalled_80_division_reform_plan: "Stalled 80-Division Reform Plan"
 CHI_stalled_80_division_reform_plan_desc: "In the aftermath of the Great European War, the Yuan Empire recognised the urgent need to modernise its enormous and unwieldy military establishment. With assistance from a joint German-Prussian Advisory Mission, the Yuan High Command initiated the ambitious 80-Division Reform Plan, intended to reduce an army of more than two hundred divisions into a smaller, professional and highly disciplined fighting force. However, the programme barely progressed beyond its initial stages before German and Prussian military advisers gradually withdrew their attention away from China, back to Europe. Left without meaningful foreign assistance or sufficient institutional experience, the Yuan High Command has struggled to continue the reforms independently."

 QIE_80_division_plan: "Implemented 80-Division Reform Plan"
 QIE_80_division_plan_desc: "Following renewed efforts by the Yuan High Command, the long-neglected 80-Division Reform Plan has finally been brought back to life. Recognising the shortcomings of the old military establishment, the imperial government has committed additional funding, personnel and institutional support towards completing the reforms. The remaining divisions are gradually being reorganised, outdated command structures dismantled and new standards of training and discipline introduced throughout the armed forces. Although the Yuan military remains some distance from the professional force originally envisioned by its German-Prussian advisers, the reform programme is once again progressing, and the foundations of a modern imperial army are beginning to take shape."

 CHI_completed_80_division_reform_plan: "Completed 80-Division Reform Plan"
 CHI_completed_80_division_reform_plan_desc: "After years of painstaking reform and restructuring, the Yuan Empire has finally completed its ambitious 80-Division Reform Plan. The once bloated and unwieldy imperial military has been transformed into a professional fighting force, built around modern command structures, rigorous training standards and a renewed emphasis on discipline and operational efficiency. The shortcomings of the old military establishment have largely been addressed, and the Yuan High Command can finally claim to possess an army capable of meeting the demands of modern warfare. Though further improvements will undoubtedly be necessary, the imperial armed forces have entered a new era of military professionalism."

 CHI_court_of_the_jade_marshal: "Court of the Jade-Marshal"
 CHI_court_of_the_jade_marshal_desc: "Marshal Kurman Beg, the famed Jade-Marshal, stands as the most influential figure in the Yuan military. His reputation was forged in the Great European War, where his tactical prowess earned him international acclaim and secured his place among the Empire's most respected commanders. Since his return, his influence has extended far beyond the battlefield, shaping the army's reformation and reaching deep into the civilian administration. Yet his prominence has come at a cost: other commanders find themselves overshadowed, while the Marshal increasingly holds the final word on military affairs. His views do not always align with the Monarchy's political direction, and disagreements over reform and foreign diplomacy have become a growing source of friction within the Imperial Court."

 CHI_conservative_high_command_1: "Conservative High Command"
 CHI_conservative_high_command_1_desc: "The Yuan High Command emerged from the Great European War convinced that its hard-won experience had revealed the future of warfare. Senior officers remain deeply attached to the doctrines that secured victory, placing their faith in entrenched positions, massed infantry and the defensive strength of prepared fortifications. New developments such as military aviation and armoured vehicles are frequently dismissed as expensive distractions rather than necessities. While younger officers and foreign advisers argue for modernisation, the old guard continues to dominate military planning, leaving the Yuan army at risk of preparing for the last war rather than the next."

 CHI_neglected_country_side_1: "Neglected Countryside"
 CHI_neglected_country_side_1_desc: "The Nanjing decade has seen truly impressive changes to our society. However modernity has been mostly limited to urban areas and the countryside have been overlooked. This could lead to the breeding ground of radical ideas."

 CHI_neglected_country_side_2: "Neglected Countryside"
 CHI_neglected_country_side_2_desc: "The Nanjing decade has seen truly impressive changes to our society. However modernity has been mostly limited to urban areas and the countryside have been overlooked. This could lead to the breeding ground of radical ideas."

 CHI_neglected_country_side_3: "Neglected Countryside"
 CHI_neglected_country_side_3_desc: "The Nanjing decade has seen truly impressive changes to our society. However modernity has been mostly limited to urban areas and the countryside have been overlooked. This could lead to the breeding ground of radical ideas."

 CHI_illicit_trade_idea: "Illicit Trade - The Vices of Modernity"
 CHI_illicit_trade_idea_desc: "As the Yuan economy faltered throughout the 1920s and 1930s, countless farmers abandoned traditional food crops in favour of opium and other lucrative cash crops. What began as a means of survival has grown into an enormous illicit agricultural trade, encouraged by wealthy landlords who profit immensely from its cultivation and export. Rather than investing these fortunes in domestic food production, many landlords use their wealth to purchase agricultural goods from foreign markets, leaving the Empire increasingly dependent on overseas harvests and vulnerable to famine beyond its borders. The trade has enriched powerful landowners and provided the government with a valuable source of revenue, but its consequences are becoming impossible to ignore: widespread addiction, deepening inequality and a countryside increasingly unable to feed itself."

 CHI_illicit_trade_allowed: "Illicit Trade - Promoted Cash Crops"
 CHI_illicit_trade_allowed_desc: "Recognising the immense profits generated by opium and other high-value cash crops, the Yuan government has begun bringing portions of the trade under its own influence. Loyal provincial governors have appropriated plantations and established state-backed agricultural enterprises, while the central administration has nationalised other operations outright. These measures provide the Imperial Treasury with a much-needed source of revenue during the ongoing economic crisis, allowing the government to benefit directly from a trade once dominated by wealthy landlords. Yet the underlying problems remain: farmland continues to be diverted away from food production, foreign agricultural imports remain essential, and the social consequences of the opium trade are becoming increasingly difficult to contain."

 CHI_illicit_trade_allowed_2: "Reformed Opium Business"
 CHI_illicit_trade_allowed_2_desc: "Rather than dismantling a trade that has become an important pillar of the Imperial Treasury, the Yuan government has chosen to formalise and expand its involvement in the opium business. State-backed enterprises and loyal provincial governors are granted greater authority over cultivation, processing and distribution, bringing an increasingly lucrative industry under closer government supervision. The resulting revenues provide the Empire with funds desperately needed for industrialisation and military modernisation. Yet the cost remains considerable: food production continues to suffer, foreign agricultural imports remain indispensable, and opium addiction spreads throughout Chinese society. The Yuan government has secured a source of wealth, but it may be mortgaging the health and security of its own people."

 CHI_illicit_trade_rooting_out: "Illicit Trade - Rooting Out"
 CHI_illicit_trade_rooting_out_desc: "The Yuan government has finally acknowledged that the unchecked expansion of opium cultivation has become a threat to the Empire's long-term prosperity. Under a new agricultural programme, provincial authorities are ordered to dismantle illicit plantations, reclaim farmland for food production and reduce the influence of landlords who have profited from the trade. The transition will not be easy: powerful interests are resisting the reforms, farmers fear losing their livelihoods, and years of neglect have left domestic food production unable to meet the Empire's needs. Nevertheless, the government hopes that restoring agricultural self-sufficiency will prevent future famines and alleviate the growing social crisis."

 CHI_illicit_trade_banned: "Reformed Agricultural Sector"
 CHI_illicit_trade_banned_desc: "The Yuan agricultural reforms are beginning to bear fruit. Former opium plantations have been returned to food production, agricultural infrastructure has been improved, and provincial administrations are increasingly focused on ensuring reliable domestic harvests. Though the transition has required considerable investment and opposition from wealthy landlords remains, the Empire is gradually reducing its dependence on foreign food imports. The countryside is becoming more productive, and the threat of another devastating famine is no longer as immediate as it once was."

