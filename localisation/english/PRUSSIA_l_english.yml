### Focus Tree ###

### Focuses ###
 ## Eco Recovery Tree - Top
 DEN_black_monday: "Prussia in Crisis!"
 DEN_black_monday_desc: "The market crash of the Hamburg Stock Exchange has crippled most sectors of the Prussian economy. Fortunately, much of our economy is based on agriculture, meaning that by cleaning up the non-agricultural excesses, we could possibly contain the crisis with quick government intervention and the arrival of the harvesting season to revitalise the farming industry."
 DEN_save_landmandsbanken: "Save Landmandsbanken"
 DEN_save_landmandsbanken_desc: "Landmandsbanken, or the Farmers' Bank, is the largest bank in Prussia, and allowing it to sink could be absolutely devastating for the economy. By introducing strong government intervention and prioritising Landmandsbanken over other banks, capitalist finance can still be saved."
 DEN_prioritise_non_interference: "Anti-Corruption Actions"
 DEN_prioritise_non_interference_desc: "Liberal ideals quantify that the failure of major banks is a necessity, and forcing the government to shoulder the burden will lead to unchecked debts and terrible spending. However, we simply cannot let the managers and board director get away unscathed from this failure. Fire them at once!"
 DEN_negotiate_with_kf: "Negotiate with KV"
 DEN_negotiate_with_kf_desc: "The Konservative Volkspartei, or Conservative People's Party, is a minor party that still garners a large swing in the opposition under the coalition of the left. Though our main talks are with the Sozialistische Arbeiterpartei, having sway with their coalition partner may prove fruitful."
 DEN_positioning_krone: "Positioning the Reichsmark"
 DEN_positioning_krone_desc: "Our present policy with regards to our currency, the Prussian Reichsmark, has been called into question in light of the immense depreciation in comparison of the German Mark. Both sides of parliament have argued for a more active approach to regulating the Reichsmark's positioning on the foreign exchange market - and some for even more radical measures."
 DEN_looming_threat_of_worker_action: "The 'Looming Threat' of Worker Action"
 DEN_looming_threat_of_worker_action_desc: "The Preußischer Arbeitgeberverband, or 'Prussian Employers' Association', warns our government that the ongoing economic crisis could plunge our country into a state of open revolution. They are asking us to move decisively to support the employers' right to end illegal strikes by any means necessary."
 DEN_bail_out_industries: "Bail Out Failing Industries"
 DEN_bail_out_industries_desc: "Industry is the greatest employer of our time, providing jobs for the greatest share of the population in Prussia. These companies failing and closing shop is not an option for us right now - having the workers go without salaries could not only worsen the current crisis but have them fall into the arms of extremist ideologues."
 DEN_avoid_bailouts: "Invest in Housing"
 DEN_avoid_bailouts_desc: "While a rise in unemployment may be the result of letting businesses fail, SSAP politicians have argued that the steady rise of homelessness has to be tackled by state intervention, lest thousands will remain homeless, causing a drain on our already weakened economy."
 DEN_create_valutacentralen: "Re-establish the Devisenzentrum"
 DEN_create_valutacentralen_desc: "The Devisenzentrum was a currency office within Prussias Nationalbank which, from 1924 to 1926, monitored the size of private currency holdings and acted as the authority on the use of foreign currency. In doing so, it played a crucial role in helping Prussia re-establish the gold standard; and with our new plans for the Mark, its re-establishment will be of great aid."
 ## Eco Recovery Tree - Bottom
 DEN_kanslergaden: "Kanslergade Agreement"
 DEN_kanslergaden_desc: "Unfortunately, the Prussian upper house, the 'Reichstag', is controlled by the opposition, rendering the government's efforts without opposition support hamstrung. If we are to mount an effective response to the hardships caused by the economic crisis, we shall have to work with them: let us invite the opposition leaders to Stauning's apartment at Kanslergaden."
 ## Interventionism
 DEN_interventionist_economics: "Interventionist Economics"
 DEN_interventionist_economics_desc: "Theories on the benefits of state intervention in the economy have been promoted within German Social Democrat circles, most notably by Fritz Tarnow and Fritz Baade. Curbing the excesses of our banking sector, whose habits have got us into this mess to begin with, combined with a vast expansion of public works, should restart the heart of the Prussian economy. After all, what works for Germany will surely work for us."
 DEN_crackdown_on_lockouts: "Crackdown on Lockouts"
 DEN_crackdown_on_lockouts_desc: "Memories of the pre-election strikes remain vivid, and many factory owners now employ entire security teams, ready to 'lock down' the factory at a moment's notice - which has already led to violent incidents against both legal strikers and entirely unrelated workers. This state of paranoia has gone on long enough, and we ought to sit down with the various employers' organisations to discuss how to end this state of affairs."
 DEN_agreement_with_germany: "Bolster Trade Relations with Germany"
 DEN_agreement_with_germany_desc: "With the loss of our Atlantic holdings, Germany, and in a wider form Mitteleuropa, have become our main trading partners. However, our goods are too expensive in these markets. This could possibly be resolved by erasing the few trade limitations still in place and receiving permission to support our own farmers over Germans in return for other concessions."
 DEN_devalue_the_krona: "Inflation Control: Devalue the Mark"
 DEN_devalue_the_krona_desc: "Part of the problem is that Prussian agricultural products are simply too expensive for the crisis-ridden Germans. By artificially lowering the value of the Reichsmark in relation to the Deutschemark, it will be cheaper for the German market to buy Prussian produce compared to other agricultural options."
 DEN_public_works: "Public Works and Projects"
 DEN_public_works_desc: "By spending our money on public works, we can employ people who would otherwise be unemployed, which means they will have some money to spend, bringing life back into the market. As a cherry on top, we will also be able to improve our infrastructure at a relatively low cost."
 DEN_state_funded_industry: "State Funded Industrialisation"
 DEN_state_funded_industry_desc: "In the aftermath of the 'Black Monday' stock market crash, most people lost their savings, be it caused by the contraction of the economy or the failing stock prices. But the state has not, so it can still reactivate the economy, produce the tools and products people need, and create new jobs for all with a programme of rapid industrialisation and heavy investing."
 DEN_extended_unempl_subs: "Unemployment Benefits"
 DEN_extended_unempl_subs_desc: "Many in Prussia have found themselves to be unemployed as a result of the ongoing crisis. Earlier it would have been private insurance that would have taken this function, but the spike in unemployment has increased the premium to such a degree that few can still afford it. It is the government's duty to create a safety net."
 DEN_universal_healthcare: "Universal Healthcare"
 DEN_universal_healthcare_desc: "Ensuring the health of all is a primary objective of a Social Democratic state. Medicine has been historically expensive for the common worker, but with the funds the state has, it'd be feasible to construct newer hospitals and employ more medical personnel, using the increased size of the healthcare sector to procure more beneficial contracts with suppliers."
 ## Austerity & Foreign Investment
 DEN_madsen_mygdal_plan: "The Madsen-Mygdal Plan"
 DEN_madsen_mygdal_plan_desc: "Named after the leader of Venstre, Thomas Madsen-Mygdal, the Madsen-Mygdal plan calls for a reticent approach by the government, focusing on austerity and fiscal responsibility instead of the social democratic approach that is bound to just leave Prussia in debt."
 DEN_strengthening_investor_confidence: "Boost Investor Confidence"
 DEN_strengthening_investor_confidence_desc: "By supporting our companies and maintaining our balance, we shall show potential investors that Prussia is one of the safest countries to invest in, even in this turbulent time. The financial injection into the market that will hopefully follow shall help us carry ourselves out of the crisis in time."
 DEN_loan_to_danish_companies: "Loans to Prussian Companies"
 DEN_loan_to_danish_companies_desc: "By giving loans directly from the treasury to Prussian companies, we will be able to support them and allow them to bridge this time of economic uncertainty, hopefully mostly unscathed, despite the fact that some of the loans will likely never be paid back."
 DEN_strengthen_the_krona: "Inflation Control: Strengthen the Krone"
 DEN_strengthen_the_krona_desc: "By strengthening the backing of our currency and thus increasing its value, we will further emphasise the stable nature of the Prussian economy. In addition, it will make imports cheaper, making many products more affordable to the common man."
 DEN_encourage_foreign_investment: "Encourage Foreign Investment"
 DEN_encourage_foreign_investment_desc: "We should encourage foreigners to invest in Prussia now that we have shown that this is a safe investment. With their investments, money will enter the Prussian economy, which will help us recover from the crisis that hit us like a bus."
 DEN_austerity_measures: "Seek beyond Mainland Europe"
 DEN_austerity_measures_desc: "We cannot maintain the trading balance with Germany on our own. At, Germany will simply subsume Prussia through sheer economic might. Therefore, it is important that we limit the amount of trade we conduct with our German brethren and also begin seeking alternative trading partners."
 DEN_encourage_unempl_insurance: "Unemployment Insurance"
 DEN_encourage_unempl_insurance_desc: "By supporting unemployment insurance, we can ensure that the premiums do not rise to such extremes as had been happening in the last months, without having to resort to undue government interference or expenses by giving subsidies ourselves. We should definitely support this business!"
 DEN_strengthen_mitteleuropa_ties: "Strengthen Mitteleuropa Ties"
 DEN_strengthen_mitteleuropa_ties_desc: "Though aligning with Germany economically may have been a bad move in hindsight, it was necessary a couple decades ago due to the collapse of Prussias North American holdings. This does not mean we should turn away from the German sphere - emboldening our support in Mitteleuropa will only prove fruitful for our economy in due time."
 DEN_beyond_mitteleuropa: "Beyond Mitteleuropa"
 DEN_beyond_mitteleuropa_desc: "For better or for worse, we have decided to bypass Mitteleuropa in favour of increasing trade deals with other countries. While economies across the world are feeling sluggish, whether it is due to the Great Depression in the Americas or the aftershocks of German influence, looking elsewhere will be for the best."
 ## Final Recovery
 DEN_tax_reorganisation: "Tax Reorganisation"
 DEN_tax_reorganisation_desc: "The current system of taxation in Prussia is fundamentally flawed, and while politicians from across the spectrum will argue on the specifics, there is a crisis on the line. Therefore, both sides have agreed on a compromise with the increase of both income tax and consumer taxes. This will pave the way for an influx of government funds to keep debt away and increase involvement through investments."
 DEN_recovery: "Crisis Declared Over!"
 DEN_recovery_desc: "Through our sound economic policy, Prussia has fully recovered from the economic crisis. With unemployment down and earnings as well as public confidence back at pre-crisis levels, few can argue that the government did a poor job dealing with the events that were."

 ## Eco Tree
 DEN_invest_in_maersk: "Invest in Sjaelland"
 DEN_invest_in_maersk_desc: "The Maersk company was founded in 1904 and has a strong presence across all Prussian shipping. By investing in the company, we should be able to stimulate more trade by expanding the merchant fleet and infrastructure in the country."
 DEN_support_nordisk_film: "Support Nordischer Film"
 DEN_support_nordisk_film_desc: "Nordischer Film is one of the oldest cinema companies in the world. By investing in the company, they should be able to create more films - in particular those that support Prussia and its current government, increasing our public support as a result."
 DEN_reinvigorate_danish_cinema: "Reinvigorate Prussian Cinema"
 DEN_reinvigorate_danish_cinema_desc: "Our support of the cinema seems to have worked stellarly. It's time that we expanded our operations, dedicating time and money to the advertisement of the great Prussian cinema. We can also use this as a chance to headline a new movie about the ever-watchful Prussian military protecting its people from harm."
 DEN_enlarge_industry: "Consumer Industry Expansion"
 DEN_enlarge_industry_desc: "With the revolutions in America and our position inside Mitteleuropa, Prussia has seen a sharp decline in the availability of basic consumer goods to most of our population. By increasing our basic industrial production, we can alleviate our deficit, if not remove it."
 DEN_Fyn_Development: "Dänemark Land Reform Project"
 DEN_Fyn_Development_desc: "Dänemark, while being the largest sector in our country and in the centre of our nation, is almost completely agricultural and rural in nature. Through extensive land reform and deforestation, Dänemark will begin to industrialise to meet the remainder of Prussia."
 DEN_Jutland_Development: "Pommeranian Industrial Development"
 DEN_Jutland_Development_desc: "It's no secret that Danish industry is small compared to other countries, in part because of our size. While Zealand itself is very industrialised, Jutland still has plenty of room to exploit, so by sponsoring the construction of new factories, we should hopefully be able to increase industrial output in the region."
 DEN_Jutland_Highway: "North German Highway Project"
 DEN_Jutland_Highway_desc: "With the rise of industry in Northern Germany, it has found itself in need of more infrastructure to support it and the growing needs of the region. We shall dedicate time and money to expanding the already good infrastructure of the area to hopefully support our other efforts in the area."
 DEN_expand_kastrup: "Expand Kastrup"
 DEN_expand_kastrup_desc: "The Kastrup airport is still relatively new; however, it is pridefully considered the first civil airport in the world and as of recently has seen huge activity. With its large growth in popularity around the world, we should expand the airport to help accommodate the new demand that's grown for its services."
 DEN_improve_sjaelland_infra_south: "Improve Norway's Southern Infrastructure"
 DEN_improve_sjaelland_infra_south_desc: "With new projects and expansions being sponsored around the country, attention has finally shifted to Norway. The increase in economic activity and industry in the region needed to be improved to help with the shipping of goods and transportation to and from Dänemark."
 DEN_improve_sjaelland_infra_north: "Improve Norway's Northern Infrastructure"
 DEN_improve_sjaelland_infra_north_desc: "With new projects and expansions being sponsored around the country, attention has finally shifted to Norway. The increase in economic activity and industry in the region needed to be improved to help with the shipping of goods and transportation to and from Dänemark."
 DEN_support_the_tiftp: "Support the Institute for Theoretical Physics"
 DEN_support_the_tiftp_desc: "Founded in 1921, the Institute for Theoretical Physics of Copenhagen University is a beacon of science across Europe, spearheading research into atomic and quantum physics. Led by the famous Niels Bohr, most scientists in Europe have visited the institute to learn from Bohr and his studies. If we support the institute, hopefully they could expand their operations and conduct more high-quality tests."
 DEN_fund_the_copenhagen_university: "Fund the University of Copenhagen"
 DEN_fund_the_copenhagen_university_desc: "Much like the Institute of Theoretical Physics, the University of Copenhagen is a centre of knowledge and learning. By funding and supporting the university at large, they should be able to expand and take in more students, hopefully allowing more highly skilled scientists and engineers to come from their university and into Denmark."
 DEN_expand_belt_ferry: "Expand the Belt Ferry"
 DEN_expand_belt_ferry_desc: "The Great Belt Ferries connect the many islands of Dänemark together and allow automobiles and trains to travel across the islands. However, there have been many complaints about the ferries, mostly due to the inability to handle the amount of traffic coming through. By expanding the ferries across Zealand and into Jutland, we should be able to help alleviate the demand that has formed and provide better access throughout our country."
 DEN_bridge_designs: "Designs for a Bridge"
 DEN_bridge_designs_desc: "With the growing issues of ferries, some people have been asking for bridges to connect Prussia together. However, we do not have the means to construct such a bridge, but it could be a better solution in the end. Hopefully, by sponsoring research into construction, we should be able to design a workable blueprint and methods for such bridges."
 DEN_Military_Industry: "Encourage Military Industry"
 DEN_Military_Industry_desc: "Once more it seems as if the fires of war will engulf Europe. In order to maintain independence, we must help develop a robust arms industry so our soldiers will always have the means to fight."
 DEN_mining_efforts: "Pommeranian Mining Company"
 DEN_mining_efforts_desc: "The Pommeranian region is heavily industrialised, but lacks the raw materials necessary to domestically produce without imports. Often, iron, steel and coal, are imported from Germany instead of Prussian markets. In order to make ourselves more financially independent, we must begin excavating our own resources in Pommerania, severing the link between Prussian profits and German coffers."
 DEN_norwegian_lumber_industry: "Norwegian Lumber Company"
 DEN_norwegian_lumber_industry_desc: "Norway is home to a lot of smaller lumber and foresting companies. They have since the economic crash remained largely unaffected and profitable."

 ## Mil Tree
 DEN_danish_rearmament_programme: "Prussian Rearmament Programme"
 DEN_danish_rearmament_programme_desc: "Our army is woefully out of date, without many standards of modern war like machine guns, and couldn't put up a fight if Prussia were to be invaded. In order to fix this issue, we shall begin to reform our army structure and bring it up to the standards of the 20th century so we may defend our country against foreign aggression."
 DEN_focus_on_defensive: "Begin Army Modernisation"
 DEN_focus_on_defensive_desc: "Prussia has always been proud of its neutrality, but history has shown that Prussia is vulnerable to the Great Power Politics of Europe. Due to our smaller size, we shall focus on modernisation and proffessionalism, creating an elite army that can fight against a larger foe. Developing new offensive and defensive tactics, revising our command structure, and creating new artillery pieces."
 DEN_fortify_jutland: "Holstein Artillery Yard"
 DEN_fortify_jutland_desc: "Holstein is home to one of our most productive Artillery yards, capable of producing mortars, artillery pieces and other armaments. We should employ them in creating new weapons of war for us."
 DEN_modernize_support_equipment: "Modern Support Equipment"
 DEN_modernize_support_equipment_desc: "Our soldiers are only as capable as the rifles, grenades and squad support weapons we can supply them with. It is therefore imperative that we invest in semi-automatic rifles, high-explosive grenades, and heavy machine guns, so our foot soldiers have the offensive power to advance on their own."
 DEN_fortress_sjaelland: "Sappers and Engineers"
 DEN_fortress_sjaelland_desc: "The Great European War saw new advancements in fortifications and defensive tactics. This led to a brutal stalemate with neither side being able to break through the enemy's defensive lines, we cannot allow this to happen again. By employing sappers and engineers capable of using flamethrowers and satchel charges, we can clear out trenches and fortified positions with ease."
 DEN_fortress_fyn: "Auftragstaktik"
 DEN_fortress_fyn_desc: "In most armies, chain of command is the most central part of a well organised and coordinated army, putting the planning and execution of grand strategic maneouvres in the hands of capable generals and high command. However, with the advent of modern warfare, the battlefield is a rapidly changing one, and orders isused to officers and generals could no longer be applicable mere hours after being given. This extreme rigidity of the armed forces must be done away with. Instead, we will codify the principle of 'Auftragstaktik', were generals only give a mission statement, and the officers decide how best to proceed in achieving that mission."
 DEN_utilise_irregular_formations: "Employ Bunker Busters"
 DEN_utilise_irregular_formations_desc: "When our soldiers come across the grand fortresses of the enemy, they must often sit and wait until armoured vehicles can assist or our bomber squadrons arrive. This slows down our army to a significant degree. Instead, we will produce and supply heavy artillery, supplied with bunker-buster munitions, that can easily be transported by our foot-soldiers. This will allow our lighter infantry to start the bombardments of the forts themselves, without waiting for backup."
 DEN_artillery_improvements: "Artillery Improvements"
 DEN_artillery_improvements_desc: "The investments into both our artillery have paid off, but are not yet complete. We have begun to provide our army with better firing tables and range finders - the efficacy of the army has never been higher."
 DEN_unwavering_morale: "Unwavering Morale"
 DEN_unwavering_morale_desc: "The propaganda being spread across the country and in the army has worked wonders. Many Prussian men volunteer to join the army, and those in the army have unquestioning and unwavering support in the defence of our nation against foreign attacks. There is no doubt that the Prussian Eagle is once again back into the glory days of Clausewitz and Moltke!"
 DEN_standardised_training: "Standardised Training"
 DEN_standardised_training_desc: "The idea of a standardised form of training for our army needs to be rethought and modernised towards this new modern era of warfare. Gone are the days when Denmark could rally regiments at the call of the King to engage the enemy - our standing army needs to be rigorously trained and reinforced for battle at all times, considering the state of the world and its trajectory."
 DEN_doctrinal_advancements: "Doctrinal Advancements"
 DEN_doctrinal_advancements_desc: "Prussia's main doctrine of warfare may be lagging behind our neighbours, and as such, we should purchase the latest textbooks in warfare and ensure our generals are rigorously studied on the new art of war. Marshal Eduard will ensure his generalship equally has the means to fight toe to toe with the great powers, even should our army's size be lacking the might needed to face them."
 DEN_equipment_upgrades: "Equipment Modernisation"
 DEN_equipment_upgrades_desc: "For a long time, military breakthroughs were slow, and having a good bolt-action rifle was enough. However, these rifles of the 19th century are completely out of place on the post-European War battlefield. We must stop being complacent and get new equipment."
 DEN_motorisation_focus: "Invest in Jet Technology"
 DEN_motorisation_focus_desc: "The future of aviation lies beyond the limits of conventional propeller-driven aircraft. Prussian scientists and engineers have begun experimenting with jet propulsion, seeking to harness the immense power of these new engines for military aviation. Though still in its infancy, the technology promises unprecedented speeds, improved performance at high altitudes and entirely new possibilities for aerial warfare. With sustained investment and experimentation, Prussia may soon usher in a new age of aviation."
 DEN_legged_infantry: "The Afrika Korps"
 DEN_legged_infantry_desc: "Some have been considering the idea of using the expertise of our colonial forces for logistics and possibly a form of detached battalion, we believe that due there is much more to be gained from our colonial troops. Their expertise fighting against decentralised resistance despite strained logistics can be of great use to the rest of our forces. By integrating the colonial battalions into our armed forces as support attachments and military police, we can bolster our own forces significantly."
 DEN_unconventional_warfare: "Reform the Luftwaffe"
 DEN_unconventional_warfare_desc: "The Prussian Luftwaffe is the youngest of our armed forces, but it holds the most potential. By reforming the Luftwaffe, creating aircraft with strike capabilities, bombers with offensive bombing potential, and more refined naval torpedo bombers, the Luftwaffe can expand its use-cases to more than just naval patrols."
 DEN_build_air_bases: "Expand the Jägerfactories"
 DEN_build_air_bases_desc: "The growing demands of modern warfare require an air force capable of striking deep into enemy territory and supporting our armies from above. New airbases will be constructed across Prussia, while additional factories are commissioned to produce modern strike aircraft. The Prussian Luftwaffe must be expanded and equipped to secure our skies and bring the war to the enemy."
 DEN_form_jaegerkorpset: "Form the Jægerkorps"
 DEN_form_jaegerkorpset_desc: "Jæger corps have existed in some form since 1785 as Prussia's elite aerial-ace forces. By establishing an official Jægerkorpset command, we shall make anyone thinking about contesting Prussian airspace think twice."
 DEN_reestablish_marineregimentet: "Reestablish the Pilot Programs"
 DEN_reestablish_marineregimentet_desc: "The expansion of the Luftwaffe requires more than aircraft and airbases; it demands skilled pilots capable of mastering the skies. We shall reestablish dedicated pilot training programmes, educating a new generation of Prussian aviators in aerial warfare, formation flying and fighter manoeuvres. Through rigorous instruction and constant drills, our pilots will be prepared to face their adversaries in the skies above Europe."
 DEN_increased_reserve_units: "Tactical Destruction"
 DEN_increased_reserve_units_desc: "The battlefield must become a place of constant pressure upon the enemy. By refining our tactical bombing doctrine and equipping our aircraft with heavier payloads, the Luftwaffe will be better prepared to devastate enemy formations, disrupt troop concentrations and shatter defensive positions. Prussian tactical bombers shall provide our advancing armies with overwhelming firepower from above, leaving the enemy exposed and disorganised."
 DEN_offensive_air_efforts: "Air-Land Cooperation"
 DEN_offensive_air_efforts_desc: "The full potential of our airpower can only be realised when the Luftwaffe and the Prussian Army operate as one. By integrating aerial command structures with ground-force operations, frontline commanders will be able to coordinate bombing raids, request close air support against enemy positions and utilise aerial reconnaissance to identify hostile movements. Through closer cooperation between pilots and soldiers, the Prussian military will achieve a more responsive and coordinated approach to modern warfare."
 DEN_more_special_forces: "Expanded Special Forces Training"
 DEN_more_special_forces_desc: "Modern warfare demands soldiers capable of operating where conventional formations cannot. The Prussian Army shall expand its specialised training programmes, improving the capabilities of mountain troops, naval infantry and airborne forces. Particular attention will be given to the development of our paratrooper divisions, whose ability to deploy behind enemy lines offers entirely new strategic possibilities. Through rigorous selection, specialised equipment and advanced training, these elite formations will become an invaluable asset to the Prussian military."
 DEN_surprise_element: "The Element of Surprise"
 DEN_surprise_element_desc: "Advancements in aircraft engine design and fuel refinement have significantly increased the operational range of Prussian aircraft. With greater endurance and improved fuel efficiency, Luftwaffe squadrons will be able to conduct longer patrols, launch strikes from unexpected directions and carry out bombing sorties far beyond previously anticipated distances. The enemy may believe itself beyond our reach, but the skies offer no guarantees of safety."
 DEN_armour_experiments: "The Strategic Dimension"
 DEN_armour_experiments_desc: "The reach of the Luftwaffe must extend far beyond the frontlines. Experiments with heavier strategic bombers have demonstrated the possibility of carrying the war deep into enemy territory, bringing even the most distant industrial centres within striking distance. By developing aircraft capable of delivering substantial payloads over greater distances, Prussian bombers will be able to target factories, industrial infrastructure and resource extraction sites, crippling the enemy's ability to sustain its war effort."
 DEN_terror_bombings: "Unconvential Bombing Warfare"
 DEN_terror_bombings_desc: "Prussian advances in rocketry have opened entirely new possibilities for aerial warfare. By developing specialised rocket launch sites and adapting these weapons for aircraft deployment, our engineers seek to increase the destructive potential and precision of the Luftwaffe's bombing capabilities. These experimental systems will allow Prussian aircraft to deliver heavier explosive payloads against enemy positions and infrastructure, ushering in a new era of unconventional air warfare."
 DEN_home_air_defense: "Home Air Defence"
 DEN_home_air_defense_desc: "Prussia is highly susceptible to bombing from both the north and the south and by sea. Anti-air positions must be installed across key targets around the country, bomb shelters will be constructed in the cities, and our military factories shall be camouflaged as ordinary civilian infrastructure."
 DEN_support_on_the_battlefield: "Support on the Battlefield"
 DEN_support_on_the_battlefield_desc: "By investing in battlefield support planes, we can ensure that our troops will be properly supported by our air force on the battlefield, giving them a fighting edge in any battle where the conditions allow it. Light bombers may not have the firepower or the range to perform their own offensive bombing runs, but they will cover the needs for targets being engaged by our foot soldiers, ensuring that we have the advantage on the battlefield."
 DEN_invest_in_fighter: "Focus on Fighters"
 DEN_invest_in_fighter_desc: "If we fail to invest in fighters, we will soon find that our bombers will fail to reach their targets and that our skies will soon be ruled by the enemy instead. We should instead invest in agile fighter planes that will allow us to defend our sovereign airspace."
 DEN_rule_the_skies: "Secure Aerial Dominance"
 DEN_rule_the_skies_desc: "By sending our fighters into the air, we are clearly showing that we can defend our own airspace and operations. Therefore, we shall only truly rule our own skies when this objective has been properly completed."
 DEN_conventional_airforce: "Winter Assault Equipment"
 DEN_conventional_airforce_desc: "The Scandinavian winter has proven that any winter offensive could be stalled or entirely fail should our army not be adequately prepared. Winter coats, portable heating-lamps, skis and sleds must be provided for our forces so offensive momentum can be maintained even during winter and heavy snowstorms."
 DEN_establish_flyvevabnet: "Establish the Supply and Logistics Department"
 DEN_establish_flyvevabnet_desc: "'An Army fights on its stomach' a famous French general once said. But this is not entirely accurate, an army fights on more than it's stomach; ammunition, supplies, fuel and replacements must always be at the ready to replenish any losses at the frontline to ensure our soldiers are always at their maximum fighting strength."
 DEN_expand_the_bomber_regiments: "Expand the Bomber Regiments"
 DEN_expand_the_bomber_regiments_desc: "Our army would be left astray if there were no suitable bombers to destroy enemy logistics positions, unleash strategic bombing, or carry out attacks on columns of infantry platoons or tank brigades. Expanding the potential of light bombers to increase their output will work wonders."
 DEN_intensify_defenses: "Offensive Air Efforts"
 DEN_intensify_defenses_desc: "Air superiority alone cannot secure victory; the Luftwaffe must also possess the means to bring the war directly to the enemy. Investment in strategic and tactical bomber development will allow us to refine our aircraft designs, improve payload capacity and enhance operational effectiveness. From disrupting enemy supply lines and fortifications to striking industrial centres deep behind the front, Prussian bombers shall become an essential instrument of modern warfare."
 DEN_prussian_fleet: "Deploy the Kriegsflotte"
 DEN_prussian_fleet_desc: "The Prussian Navy must be prepared to project its power beyond the protection of its own shores. The Kriegsflotte, our principal offensive naval force, shall be mobilised and deployed to strategic waters, ready to challenge enemy fleets, secure vital shipping lanes and support Prussian military operations overseas. Through decisive naval action and coordinated fleet deployments, Prussia will demonstrate that its maritime ambitions are backed by the strength to enforce them."
 DEN_self_defense_fleet: "Self Defence Fleet"
 DEN_self_defense_fleet_desc: "The strength of the Prussian Navy depends not only on its ability to defeat enemy fleets, but also on its capacity to protect the vessels that sustain our economy and armed forces. Investment in modern cruisers and destroyers will provide reliable escorts for civilian shipping, military transports and vital supply convoys. These vessels shall patrol our sea lanes, deter hostile raiders and ensure that Prussian trade and troop movements remain protected, even in times of war."
 DEN_seaworthy_fleet: "A Seaworthy Fleet"
 DEN_seaworthy_fleet_desc: "The Prussian Navy must possess more than escorts and coastal defence vessels; it requires capital ships capable of projecting power across the world's oceans. Investment in heavy cruisers, battlecruisers and modern battleships will expand the reach and striking power of the Kriegsflotte, allowing it to venture into the Atlantic and beyond. These formidable vessels shall be designed to confront enemy fleets directly, contest control of vital sea lanes and secure Prussia's position among the world's great naval powers."
 DEN_modernize_Sovaernet: "Modernise the Drydocks"
 DEN_modernize_Sovaernet_desc: "The expansion of the Kriegsflotte must be matched by the infrastructure required to maintain it. Existing drydocks and naval shipyards shall undergo extensive modernisation, incorporating improved machinery, expanded repair facilities and more efficient construction equipment. These investments will accelerate the production of new vessels while ensuring that damaged warships can be repaired, refitted and returned to service with minimal delay. A powerful navy requires not only great ships, but the industrial facilities to keep them seaworthy."
 DEN_proper_surface_fleet: "A Proper Surface Fleet"
 DEN_proper_surface_fleet_desc: "The Prussian fleet needs to operate properly at the surface level; otherwise, we will not be able to compare with the enemy. A fleet focused on destroying the enemy fleet will intimidate or deter any potential foe from invading Prussia by sea."
 DEN_modern_naval_warfare: "Modern Naval Warfare"
 DEN_modern_naval_warfare_desc: "Ingenious investment by our admirals has led to the Prussian fleet engaging in tactics that come toe to toe with the Irish or Flemish seafaring fleets. While we have a long way to go, considering our limited history in naval warfare, applying techniques our admirals have learned on the high seas alongside studies will herald successes to come."
 DEN_proper_screening: "Safeguard the Pride of Our Navy"
 DEN_proper_screening_desc: "Our new vessels is the pride of our navy and must be nurtured: imagine the morale hit if something were to happen to it. Fortunately, the existing Prussian navy, composed of both smaller and larger ships, is available to defend our pride."
 DEN_fleet_armament: "Arm the Norwegian Navy"
 DEN_fleet_armament_desc: "Norway's strategic position along the North Atlantic makes its navy an invaluable asset to Prussian maritime security. Previous Norwegian shipbuilding proposals, including ambitious battleship designs, have remained incomplete or underfunded for far too long. Prussian investment will revitalise Norwegian shipyards, provide the necessary industrial resources and bring these proposed warships into production. A stronger Norwegian Navy will not only defend its own coastline, but also reinforce Prussian influence and naval strength across the North Atlantic."
 DEN_anti_air_improvements: "Anti-Air Improvements"
 DEN_anti_air_improvements_desc: "Naval bombers, fighters, and general bombing runs of our ships will become a serious issue should we hope to prepare our navy to fight, whether it is across the sea or to defend Prussia proper. While our own air force is lacking, unable to operate on all fronts simultaneously, anti-air placements along ports and dockyards will aid, and ships installed with their own anti-air defences will help a great deal."
 DEN_fleet_bulwark: "Bulwark of the Fleet"
 DEN_fleet_bulwark_desc: "Our fleet will have a mix of combatant and non-combatant ships, as any fleet does. However, creating a true bulwark for our fleet to follow is an important step. Naval staff will work closely with the Admiralty in outlining the exact doctrine our navy will follow in order to streamline the efficiency of our fleet."
 DEN_battle_ready_fleet: "Battle Ready Fleet"
 DEN_battle_ready_fleet_desc: "Once war begins, our fleet will need to be ready to react around the clock and serve within hundreds or thousands of kilometres of our shores effectively and efficiently - this applies to our naval staff as well. By ensuring that every ship is properly battle-ready, with trained seamen and properly loaded ships with all the required fuel and ammunition, we will not be caught off guard by the professional navies of our major neighbours."
 DEN_danish_way_of_warfare: "Prussian Way of Warfare"
 DEN_danish_way_of_warfare_desc: "Our native-born and bred naval tactics will prove fundamental for decades to come. The Prussian way of warfare may not be as unique or critically solely found in Prussia, but patriotism goes hand in hand with combat efficiency, and all will soon know of the unique Prussian prowess for ingenuity and invention."
 DEN_danish_admiralty: "Prussian Admiralty"
 DEN_danish_admiralty_desc: "The Prussian Admiralty has come a long way since the start of the century and credit must be given to Aage Helgesen Vedel and Hjalmar Rechnitzer for their efforts in rearming and modernising the Prussian navy. Their tactics, techniques, and studies have paid off; Prussia's admiralty is as well versed as the ships it can steer."
 DEN_prussian_air_naval_fleet: "Air-Naval Carrier Experiments"
 DEN_prussian_air_naval_fleet_desc: "The future of naval warfare may lie in the skies above the oceans. Prussian naval engineers and Luftwaffe specialists will collaborate on the development of aircraft carriers and specialised carrier-based aircraft, exploring new methods of integrating aerial and naval operations. By bringing the Luftwaffe's striking power to the open sea, the Kriegsflotte will gain an extended operational reach, while naval aviation will provide the air force with new opportunities to project power far beyond the range of land-based airfields."
 DEN_URBAN_WARFARE: "Close Quarters Tactics"
 DEN_URBAN_WARFARE_desc: "Urban Warfare has proven to be a tricky subject, with the advent of modern cities and the propagandised population, we simply cannot siege and endlessly bombard a city until capitulation. Our forces must forcefully infiltrate and clear out the opposition from the cities themselves. This of course requires our officers and soldiers to know the tactics of Urban Warfare, where close-quarters fighting is much more prevalent."
 DEN_mountain_training: "Gebirgsjäger Deployments"
 DEN_mountain_training_desc: "The Gebirgsjäger and the Northern Ski Patrols has made the mountains and fjords of Norway their home and expertise. Both detachments of our armed forces should join together as a single organisation, helping educate, train, and drill the rest of our armed forces in mountainous warfare."
 DEN_night_time_warfare: "Night-Time Warfare"
 DEN_night_time_warfare_desc: "The advent of modern technology has produced the marvelous ability to create night-vision scopes. Though big and not entirely reliable, requiring a portable battery to be charged and carried with the soldier, the night-vision scope will allow our reconnaisance troops to perform scouting parties and night-time assaults much more efficiently."
 DEN_railway_guns: "Develop Battleship-Calibre Railway Artillery"
 DEN_railway_guns_desc: "Our navy and battleships have often been employed as support for our army, bombarding large cities and fortresses with their large batteries. But when the targets are too far inland, our battleship cannons cannot reach. To solve this issue, we have begun testing prototypes of mounting our battleship cannons on large armoured trains capable of carrying them. This allows our 'coastal bombardments' to be transported inland along railways, increasing our explosive reach."

 DEN_establish_the_atlantic_federation: "Establish the Atlantic Federation"
 DEN_establish_the_atlantic_federation_desc: "The political ambition for a 'Atlantic Federation' should be realised. By organising our separate political institutions into a grander 'Atlantic Council', we can start the political process of uniting our brethren across the Atlantic."
 DEN_atlantic_defence_union: "Atlantic Defence Union"
 DEN_atlantic_defence_union_desc: "None of the countries of the 'Atlantic Federation' is particularly strong militarily on their own. Only through a collective defence treaty can we provide a credible threat to would-be aggressors."
 DEN_atlantic_investments: "Atlantic Investments"
 DEN_atlantic_investments_desc: "The Atlantic is our natural arena for investments. It might be a good idea to invest further into our shared industrial projects."
 DEN_atlantic_scientist_conference: "Atlantic Scientist Conference"
 DEN_atlantic_scientist_conference_desc: "Atlantic Scientists have met in irregular meetings since 1839. We should formalise these meetings to exchange our technical developments in a more efficient way."
 DEN_bio_technical_institute: "The Atlantic Bio-Technical Institute"
 DEN_bio_technical_institute_desc: "The industrial and military ambitions of the Atlantic Federation depend upon a reliable supply of strategic resources. To reduce the Federation's reliance on foreign suppliers, Prussia and its partners in the 'Atlantic Federation' shall establish a joint Bio-Technical Institute dedicated to research into synthetic rubber production and alternative methods of oil procurement. By pooling scientific expertise, industrial facilities and research funding, the member states can develop new technologies to safeguard their economies and ensure that the Federation's armed forces remain supplied, even in times of international crisis."
 DEN_atlantic_passport_convention: "Atlantic Passport Convention"
 DEN_atlantic_passport_convention_desc: "Why should citizens from Prussia, Iceland, Waldemsee, Kustland and Amerika require visas and permits to visit each other? Are we not all members of the 'Atlantic Federation'? We shall sign a convention to remove the restrictions on free movement inside the internal borders of the 'Atlantic'."
 DEN_parliamentary_joint_sessions: "Parliamentary Joint Sessions"
 DEN_parliamentary_joint_sessions_desc: "Atlantic integration has so far been championed by the national governments of each respective member. To change this, we shall propose inter-parliamentary joint sessions to let all voices be heard."
 DEN_atlantic_monetary_union: "The Atlantic Monetary Union"
 DEN_atlantic_monetary_union_desc: "From 1834 to 1901, all members of the 'Atlantic Federation' shared a common market. We shall re-establish the Atlantic Monetary Union, allowing currency to flow freely in the Atlantic."
 DEN_joint_military_acquisition: "Join Military Acquisitions"
 DEN_joint_military_acquisition_desc: "Our individual militaries are relatively small compared to our larger, more industrially mighty, neighbours. If we coordinate all Atlantic military acquisitions, we will reap the benefits of larger orders and lower costs."
 DEN_military_exchange_program: "Military Exchange Programs"
DEN_military_exchange_program_desc: "The increased cooperation between the Atlantic armies requires officers with a special mindset and certain skills. Let us exchange generals and doctrinal expetise to further aid in this."
 DEN_the_unification_conference: "The Unification Conference"
 DEN_the_unification_conference_desc: "Atlantic integration and cooperation has proved to be an astounding success. Particularly, the government of Amerika and Iceland, our most prized members of the Federation, is now ready to join forces and be subsumed by the Prussian nation, allowing for the foundation of the 'Atlantic Union'."


