# IDEAS
 JAP_rampant_landlordism: "Rampant Landlordism"
 JAP_rampant_landlordism_desc: "Land use in Japan is highly inefficient. Much of the farmland is owned by landlords or old Samurai clans who rent it out to tenant farmers at exorbitant rates. This leads to a stagnant social system, which has contributed to both the political polarisation of the countryside, and to the mass migration of tenant farmers to the cities in search of better fortunes."
 
 JAP_narrow_gauge_railways: "Narrow-gauge Railways"
 JAP_narrow_gauge_railways_desc: "Japan's railways were built using an unusually narrow gauge inherited from the Irish and Dutch during the Meiji Era. While it does make construction easier in Japan's mountaineous terrain, its speed limitations have negatively impacted our industry. Experts argue over whether conversion is worth the government's time."

 jap_duplicate_air_research: "Duplicate Air Research"
 jap_duplicate_air_research_desc: "Our air force is currently divided between the Imperial Japanese Army Air Service and the Imperial Japanese Navy Air Service, being divided both in operation, production as well as research and development between our navy and army. Due to this it faces large logistical bottlenecks, some of which can only be overcome by the merging of our air forces."

 JAP_CHI_chaotic_army_command: "Chaotic Army Command"
 JAP_CHI_chaotic_army_command_desc: ""

 JAP_chaotic_frontline: "Chaotic Frontline"

# EVENTS
 JAP_news_events.1.t.a: "Japan Seizes Formosa"
 JAP_news_events.1.desc.a: "For centuries, the island of Formosa has stood as the final remnant of the old Ming Dynasty, a kingdom driven from the Chinese mainland by the Turkic-Mongol invasions of the sixteenth and seventeenth centuries. While the Yuan Dynasty consolidated its rule over China, the descendants of the Ming court maintained their independence on Taiwan, preserving the institutions and traditions of the old Chinese Empire. That final chapter has now been brought to an abrupt end. Japanese forces have launched a swift invasion of the island, easily bypassing the small Formosan navy and securing control of its most important coastal positions. The principal bureaucratic centres have fallen, and Japanese troops now occupy the city of Taibei and beyond, effectively dismantling the island's central administration.\n \n Although sporadic resistance continues in the mountainous interior, the organised defence of Formosa has largely collapsed. For Tokyo, the operation represents a decisive expansion of Japanese influence in East Asia and the acquisition of a strategically valuable island."
 JAP_news_events.1.desc.b: "News of the Japanese invasion and occupation of Formosa has spread rapidly throughout the international community, prompting a mixture of concern, condemnation and cautious observation. The island, long regarded as the final stronghold of the old Ming Dynasty, has now fallen following a remarkably swift Japanese campaign. With the city of Taibei and the principal administrative centres under Japanese control, only scattered resistance remains in the mountainous interior. \n \nWhile many foreign governments have yet to issue formal statements, the sudden expansion of Japanese influence has revived concerns over the Empire's ambitions in East Asia. Particularly alarmed are the Irish, Dutch and Prussian officals who have issued diplomatic objections to what they consider an unlawful occupation and annexation. Formosa occupies an important strategic position along the maritime routes connecting East Asia, and its transfer into Japanese hands threatens to undermine longstanding European commercial and naval interests in the region. \n \nThough none of the European powers appears eager to risk an immediate confrontation with Tokyo, the seizure has not gone unnoticed. Across the world, diplomats and military observers are beginning to ask whether Formosa is merely the latest Japanese acquisition, or the indication of a far more ambitious plan."
 JAP_news_events.1.a: "A decisive blow to the Chinese."
 JAP_news_events.1.b: "Concerning to say the least."

 JAP_events.1.t: "Japanese Troop Movements"
 JAP_events.1.d: "Reports from the northern frontier have caused growing alarm within the Yuan Imperial Court. Following the conquest of Korea, Japanese military activity along the peninsula's border with the Empire has increased considerably. Intelligence officers report the movement of additional infantry formations, artillery units and logistical supplies towards the frontier, while Japanese military transports have been observed carrying personnel and equipment across the region. Although Tokyo has offered no explanation for these deployments, their scale and proximity have raised serious questions about Japanese intentions. The swift seizure of Formosa and Korea has already demonstrated Japan's willingness to expand its influence through military force, and many within the Yuan High Command fear that Korea may now serve as a staging ground for an invasion of mainland China. \n \nThe Imperial Government has ordered its intelligence services to intensify surveillance and instructed frontier commanders to remain vigilant. Whether these movements are merely defensive preparations or the prelude to a much larger campaign remains unknown. For the first time, the possibility of a Japanese invasion is being taken seriously in the halls of the Yuan Empire."
 JAP_events.1.a: "I'm sure it's nothing. But prepare, just in case."

 JAP_events.2.t: "The Japanese Invasion of China"
 JAP_events.2.d: "The worst fears of the Imperial Court have finally been realised. Without a formal declaration of war, Japanese forces have launched a massive invasion across the Korean frontier, striking Yuan positions along an extensive stretch of the border. Despite weeks of intelligence reports and warnings from the Central Government, the sudden scale and speed of the offensive have caught many frontier commanders unprepared. Communications between headquarters and frontline formations have rapidly deteriorated, with entire units losing contact with their superiors. Reports of commanders abandoning their positions, officers fleeing with their staffs and divisions retreating without authorisation are arriving by the hour, even as orders from the High Command demand that every position be defended to the last man. \n \nThe situation has quickly descended into chaos, with some formations attempting to organise a defence while others are already in disarray. In the capital, the Yuan High Command struggles to comprehend the rapidly changing situation, let alone coordinate an effective response. The Japanese advance is moving faster than the Empire's military bureaucracy can react, and the fate of the northern frontier, and the entirety of China, now hangs in the balance."
 JAP_events.2.a: "How was this unexpected?! Shoot someone from the High Command!"